# Copy to NousResearch/hermes-agent as plugin-catalog/trellis.yaml.
# sha is the commit the catalog installs. It is the disclosure commit, not this file's commit.
name: trellis
title: Trellis
repo: https://github.com/0xzgbot/hermes-trellis
sha: "7692f1075ec677fa0ffbb1cd65cd049ae57b126b"
description: "Local photo to a printable STL. Trellis.2 runs on a ComfyUI host you already have; this plugin does not install it. Disclosure — calls only TRELLIS_API_URL (default http://127.0.0.1:8188), uploads the photo, and downloads the GLB and preview PNGs; writes meshes to the path you name or TRELLIS_OUT_DIR; trellis_open_slicer launches a local slicer on one .stl; the desktop card reads one model file under your home directory or TRELLIS_OUT_DIR; first start runs npm ci in mcp/ when dist/ is missing. No API key and no telemetry."
maintainer: 0xzgbot
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/0xzgbot/hermes-trellis#readme
version: "0.2.0"
readme: true
known_issues:
  - "ComfyUI with the Trellis.2 nodes and weights must already be running. This plugin does not install them."
  - "face_budget needs fast-simplification in TRELLIS_PYTHON. Without it the STL is written at the mesh's own face count."
capabilities:
  provides_tools:
    - trellis_health
    - trellis_start
    - trellis_image_to_3d
    - trellis_task_status
    - trellis_wait_task
    - trellis_download
    - trellis_render_preview
    - trellis_texturize
    - trellis_remesh_decimate
    - trellis_gallery
    - trellis_open_slicer
    - trellis_usage
  provides_hooks: []
  provides_middleware: []
  requires_env: []
